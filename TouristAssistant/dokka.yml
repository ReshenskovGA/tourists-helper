moduleName: Tourist Assistant
outputDir: docs
format: html
sourceSets:
  - sourceSetID:
      scopeId: app
      sourceSetName: main
    sourceRoots:
      - app/src/main/java
    classpath:
      - app/build/intermediates/javac/debug/classes
      - app/build/tmp/kotlin-classes/debug
    includes:
      - app/src/main/java/module.md
    samples:
      - app/src/main/java/samples
    externalDocumentationLinks:
      - url: https://developer.android.com/reference/
        packageListUrl: https://developer.android.com/reference/androidx/package-list
      - url: https://kotlinlang.org/api/latest/jvm/stdlib/
      - url: https://javadoc.io/doc/org.jetbrains.kotlinx/kotlinx-coroutines-core/latest/
    perPackageOptions:
      - matchingRegex: ".*\\.di\\..*"
        suppress: true
      - matchingRegex: ".*\\.generated\\..*"
        suppress: true
      - matchingRegex: "com\\.example\\.touristassistant\\..*"
        includeNonPublic: false
        reportUndocumented: true
        skipDeprecated: false
    jdkVersion: 17
plugins:
  - dokka.base.DokkaBase
  - org.jetbrains.dokka.kotlin.as.java.KotlinAsJavaPlugin